<aside class="sidebar">
  <div class="brand">
    <img src="/brand-logo.png" alt="Devbhoomi Opticals" class="brand-logo" />
  </div>

  <nav>
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
      <span class="dot"></span> Dashboard
    </a>

    @if (auth.isStaffOrAdmin()) {
      <a routerLink="/walk-in-order" routerLinkActive="active" class="nav-link">
        <span class="dot"></span> New walk-in order
      </a>
      <a routerLink="/inventory" routerLinkActive="active" class="nav-link">
        <span class="dot"></span> Inventory
      </a>
      <a routerLink="/admin-orders" routerLinkActive="active" class="nav-link">
        <span class="dot"></span> Orders
      </a>
      <a routerLink="/repairs" routerLinkActive="active" class="nav-link">
        <span class="dot"></span> Repairs
      </a>
    }

    @if (auth.isAdmin()) {
      <a routerLink="/users" routerLinkActive="active" class="nav-link">
        <span class="dot"></span> Users
      </a>
      <a routerLink="/audit-log" routerLinkActive="active" class="nav-link">
        <span class="dot"></span> Activity log
      </a>
       <a routerLink="/purchases" routerLinkActive="active" class="nav-link">
        <span class="dot"></span> Purchases
      </a>
      <a routerLink="/stock-history" routerLinkActive="active" class="nav-link">
        <span class="dot"></span> Stock History
      </a>
      <a routerLink="/coupons" routerLinkActive="active" class="nav-link">
        <span class="dot"></span> Coupons
      </a>
      <a routerLink="/pnl" routerLinkActive="active" class="nav-link">
        <span class="dot"></span> Profit &amp; Loss
      </a>
      <a routerLink="/error-log" routerLinkActive="active" class="nav-link">
        <span class="dot"></span> Error Log
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <div class="user-chip">
      <div class="avatar">{{ auth.currentUser()?.name?.charAt(0) }}</div>
      <div class="user-meta">
        <div class="name">{{ auth.currentUser()?.name }}</div>
        <div class="role">{{ auth.currentUser()?.role }}</div>
      </div>
    </div>
    <button class="btn btn-ghost logout-btn" (click)="confirmLogout()">Log out</button>
  </div>
</aside>
