<div class="tab-bar">
  <button type="button" class="tab-btn" [class.active]="activeTab() === 'new'" (click)="setTab('new')">
    New Order
  </button>
  <button type="button" class="tab-btn" [class.active]="activeTab() === 'repair'" (click)="setTab('repair')">
    Repair
  </button>
</div>

@if (activeTab() === 'new') {
  <app-new-order />
} @else {
  <app-repair-order />
}
